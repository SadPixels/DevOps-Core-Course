---
docker_version: latest
docker_compose_version: latest

docker_service_name: docker
docker_users:
  - "{{ ansible_user | default(ansible_env.SUDO_USER | default(ansible_user_id)) }}"

docker_apt_gpg_key_url: https://download.docker.com/linux/ubuntu/gpg
docker_apt_keyring_path: /etc/apt/keyrings/docker.asc
docker_apt_repository: "deb [arch={{ docker_apt_arch }} signed-by={{ docker_apt_keyring_path }}] https://download.docker.com/linux/ubuntu {{ ansible_distribution_release }} stable"

docker_prerequisite_packages:
  - ca-certificates
  - curl
  - gnupg
  - lsb-release
  - python3-apt

docker_packages:
  - docker-ce
  - docker-ce-cli
  - containerd.io
  - docker-buildx-plugin

docker_compose_package: docker-compose-plugin
