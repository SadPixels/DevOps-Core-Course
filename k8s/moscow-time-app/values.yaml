replicaCount: 3

image:
  repository: moscow-time-app
  tag: 1.0.0
  pullPolicy: Never

service:
  type: NodePort
  port: 8080
  nodePort: 30080

containerPort: 8080

secret:
  enabled: true
  passwordKey: MY_PASS
  password: "moscow-time-secret"

resources:
  requests:
    cpu: 100m
    memory: 128Mi
  limits:
    cpu: 500m
    memory: 256Mi

nodeSelector: {}

tolerations: []

affinity: {}
