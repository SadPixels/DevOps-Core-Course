apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: moscow-time-app
  labels:
    app: moscow-time-app
spec:
  serviceName: moscow-time-app-headless
  replicas: 3
  podManagementPolicy: Parallel
  selector:
    matchLabels:
      app: moscow-time-app
  updateStrategy:
    type: RollingUpdate
  template:
    metadata:
      labels:
        app: moscow-time-app
    spec:
      securityContext:
        fsGroup: 1000
        fsGroupChangePolicy: OnRootMismatch
      containers:
        - name: moscow-time-app
          image: moscow-time-app:1.0.0
          imagePullPolicy: Never
          ports:
            - name: http
              containerPort: 8080
          env:
            - name: VISITS_FILE
              value: /data/visits
          readinessProbe:
            httpGet:
              path: /healthz
              port: http
            initialDelaySeconds: 5
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /healthz
              port: http
            initialDelaySeconds: 15
            periodSeconds: 20
          volumeMounts:
            - name: visits
              mountPath: /data
          resources:
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              cpu: 500m
              memory: 256Mi
  volumeClaimTemplates:
    - metadata:
        name: visits
      spec:
        accessModes:
          - ReadWriteOnce
        resources:
          requests:
            storage: 1Gi
